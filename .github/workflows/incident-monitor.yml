name: Incident Monitor

on:
  schedule:
    # 10분 간격. GitHub Actions cron 스케줄은 부하 상황에 따라 지연될 수 있음.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: incident-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run incident monitor
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/monitor.js

      - name: Commit updated state
        run: |
          git config user.name "incident-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "no state changes"
          else
            git commit -m "Auto-update incident state [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
