<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>삼성화재_주식현황판.xlsx - Excel</title>
<style>
  :root{
    --excel-green:#217346;
    --grid-line:#d0d0d0;
    --header-fill:#f3f2f1;
    --header-fill-active:#e2f0d9;
    --input-blue:#1155CC;
    --up-profit:#1e7e34;
    --down-loss:#d32f2f;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    font-family:Calibri,"맑은 고딕","Segoe UI",Arial,sans-serif;
    font-size:12px;color:#222;
    background:#f3f2f1;
    user-select:none;
  }
  input,button{font-family:inherit;}

  /* ---- title bar ---- */
  .titlebar{
    background:var(--excel-green);
    color:#fff;
    display:flex;align-items:center;
    padding:4px 10px;
    font-size:13px;
    gap:8px;
  }
  .titlebar .logo{
    width:18px;height:18px;background:#fff;border-radius:3px;
    display:flex;align-items:center;justify-content:center;
    color:var(--excel-green);font-weight:bold;font-size:11px;
  }
  .titlebar .fname{flex:1;text-align:center;opacity:.95;}
  .titlebar .winctl{display:flex;gap:14px;font-size:13px;opacity:.9;}

  /* ---- ribbon tabs ---- */
  .ribbon-tabs{
    background:#fff;
    display:flex;gap:2px;
    padding:0 10px;
    font-size:12.5px;
    border-bottom:1px solid var(--grid-line);
  }
  .ribbon-tabs span{
    padding:7px 10px 6px;
    cursor:default;color:#444;
  }
  .ribbon-tabs span.active{
    color:var(--excel-green);font-weight:600;
    border-bottom:2px solid var(--excel-green);
  }

  /* ---- ribbon ---- */
  .ribbon{
    background:#fafafa;
    border-bottom:1px solid var(--grid-line);
    display:flex;align-items:stretch;
    padding:4px 10px 2px;
  }
  .rgroup{
    display:flex;flex-direction:column;align-items:center;
    padding:0 10px;border-right:1px solid var(--grid-line);
  }
  .rgroup:last-child{border-right:none;}
  .rbtns{display:flex;gap:6px;align-items:center;padding-bottom:4px;}
  .rbtns .ricon{
    min-width:22px;height:22px;display:flex;align-items:center;justify-content:center;
    border:1px solid transparent;border-radius:3px;font-size:12px;color:#333;padding:0 4px;
  }
  .rbtns select{font-size:11px;height:22px;}
  .rgroup .glabel{font-size:10px;color:#666;margin-top:2px;}
  .rbtns .ricon.b{font-weight:bold;}
  .rbtns .ricon.i{font-style:italic;}
  .rbtns .ricon.u{text-decoration:underline;}
  .swatch{width:14px;height:4px;background:var(--up-profit);display:inline-block;margin-left:2px;}

  /* ---- formula bar ---- */
  .formulabar{
    display:flex;align-items:center;gap:6px;
    background:#fff;border-bottom:1px solid var(--grid-line);
    padding:3px 10px;
  }
  #cellRef{
    width:64px;height:20px;border:1px solid var(--grid-line);
    text-align:center;font-size:12px;
  }
  .fx{color:#217346;font-style:italic;font-weight:bold;font-size:12px;padding:0 4px;}
  #formulaBar{
    flex:1;height:20px;border:1px solid var(--grid-line);
    padding:0 4px;font-size:12px;
  }

  /* ---- sheet ---- */
  .sheet-wrap{
    overflow:auto;
    height:calc(100vh - 168px);
    background:#fff;
  }
  table.sheet{
    border-collapse:collapse;
    table-layout:fixed;
  }
  table.sheet th, table.sheet td{
    border:1px solid var(--grid-line);
    height:20px;
    padding:0 4px;
    white-space:nowrap;
    overflow:hidden;
  }
  table.sheet thead th{
    background:var(--header-fill);
    color:#444;font-weight:normal;
    position:sticky;top:0;z-index:2;
    text-align:center;
  }
  table.sheet thead th.corner{
    position:sticky;left:0;top:0;z-index:3;width:40px;background:var(--header-fill);
  }
  table.sheet th.rownum{
    background:var(--header-fill);color:#444;
    text-align:center;width:40px;
    position:sticky;left:0;z-index:1;
  }
  col.rowh{width:40px;}
  col.colA{width:160px;}
  col.colB{width:150px;}
  col.wide{width:95px;}

  td.cell{background:#fff;}
  td.cell.selected{outline:2px solid var(--excel-green);outline-offset:-1px;}

  .cell-title{
    font-size:16px;font-weight:bold;color:#1e4620;
    background:var(--header-fill-active);
  }
  .cell-label{color:#333;}
  .cell-label.strong{font-weight:bold;background:#eef3fb;}
  .cell-input input{
    width:100%;height:18px;border:none;outline:none;background:transparent;
    color:var(--input-blue);font-weight:bold;text-align:right;font-size:12px;
    font-family:inherit;
  }
  .cell-calc{
    text-align:right;font-weight:bold;color:#000;background:#fffbea;
  }
  .cell-calc.up{color:var(--up-profit);}
  .cell-calc.down{color:var(--down-loss);}

  /* ---- sheet tabs / status bar ---- */
  .sheettabs{
    display:flex;align-items:center;gap:2px;
    background:#f3f2f1;border-top:1px solid var(--grid-line);
    padding:3px 10px;font-size:12px;
  }
  .sheettabs .tab{
    padding:4px 12px;border:1px solid var(--grid-line);border-bottom:none;
    background:#e6e6e6;color:#666;
  }
  .sheettabs .tab.active{background:#fff;color:#000;font-weight:bold;border-top:2px solid var(--excel-green);}
  .sheettabs .plus{padding:2px 8px;color:#666;}
  .statusbar{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--excel-green);color:#fff;font-size:11px;
    padding:3px 12px;
  }
</style>
</head>
<body>

  <div class="titlebar">
    <div class="logo">X</div>
    <div class="fname">삼성화재_주식현황판.xlsx - Excel</div>
    <div class="winctl"><span>—</span><span>▢</span><span>✕</span></div>
  </div>

  <div class="ribbon-tabs">
    <span>파일</span><span class="active">홈</span><span>삽입</span><span>페이지 레이아웃</span>
    <span>수식</span><span>데이터</span><span>검토</span><span>보기</span>
  </div>

  <div class="ribbon">
    <div class="rgroup">
      <div class="rbtns">
        <div class="ricon">📋</div><div class="ricon">✂</div>
      </div>
      <div class="glabel">클립보드</div>
    </div>
    <div class="rgroup">
      <div class="rbtns">
        <select><option>맑은 고딕</option></select>
        <select style="width:36px;"><option>11</option></select>
        <div class="ricon b">B</div><div class="ricon i">I</div><div class="ricon u">U</div>
        <div class="ricon">🎨<span class="swatch"></span></div>
      </div>
      <div class="glabel">글꼴</div>
    </div>
    <div class="rgroup">
      <div class="rbtns">
        <div class="ricon">≡</div><div class="ricon">☰</div><div class="ricon">⊞</div>
      </div>
      <div class="glabel">맞춤</div>
    </div>
    <div class="rgroup">
      <div class="rbtns">
        <select><option>일반</option><option>숫자</option><option>백분율</option></select>
        <div class="ricon">₩</div><div class="ricon">%</div>
      </div>
      <div class="glabel">표시 형식</div>
    </div>
  </div>

  <div class="formulabar">
    <input id="cellRef" value="A1" readonly>
    <span class="fx">fx</span>
    <input id="formulaBar" value="">
  </div>

  <div class="sheet-wrap">
    <table class="sheet" id="sheetTable">
      <colgroup>
        <col class="rowh"><col class="colA"><col class="colB">
        <col class="wide"><col class="wide"><col class="wide"><col class="wide"><col class="wide"><col class="wide">
      </colgroup>
      <thead>
        <tr>
          <th class="corner"></th>
          <th>A</th><th>B</th><th>C</th><th>D</th><th>E</th><th>F</th><th>G</th><th>H</th>
        </tr>
      </thead>
      <tbody id="sheetBody">
        <tr><th class="rownum">1</th>
          <td class="cell" data-addr="A1"></td><td class="cell" data-addr="B1"></td>
          <td class="cell" data-addr="C1"></td><td class="cell" data-addr="D1"></td>
          <td class="cell" data-addr="E1"></td><td class="cell" data-addr="F1"></td>
          <td class="cell" data-addr="G1"></td><td class="cell" data-addr="H1"></td>
        </tr>
        <tr><th class="rownum">2</th>
          <td class="cell" data-addr="A2"></td>
          <td class="cell cell-title" data-addr="B2" colspan="5">삼성화재해상보험(000810) 주식 현황판</td>
          <td class="cell" data-addr="G2"></td><td class="cell" data-addr="H2"></td>
        </tr>
        <tr><th class="rownum">3</th>
          <td class="cell" data-addr="A3"></td><td class="cell" data-addr="B3"></td>
          <td class="cell" data-addr="C3"></td><td class="cell" data-addr="D3"></td>
          <td class="cell" data-addr="E3"></td><td class="cell" data-addr="F3"></td>
          <td class="cell" data-addr="G3"></td><td class="cell" data-addr="H3"></td>
        </tr>
        <tr><th class="rownum">4</th>
          <td class="cell cell-label" data-addr="A4">종목명</td>
          <td class="cell cell-label" data-addr="B4">삼성화재해상보험</td>
          <td class="cell" data-addr="C4"></td><td class="cell" data-addr="D4"></td>
          <td class="cell" data-addr="E4"></td><td class="cell" data-addr="F4"></td>
          <td class="cell" data-addr="G4"></td><td class="cell" data-addr="H4"></td>
        </tr>
        <tr><th class="rownum">5</th>
          <td class="cell cell-label" data-addr="A5">종목코드</td>
          <td class="cell cell-label" data-addr="B5">000810</td>
          <td class="cell" data-addr="C5"></td><td class="cell" data-addr="D5"></td>
          <td class="cell" data-addr="E5"></td><td class="cell" data-addr="F5"></td>
          <td class="cell" data-addr="G5"></td><td class="cell" data-addr="H5"></td>
        </tr>
        <tr><th class="rownum">6</th>
          <td class="cell" data-addr="A6"></td><td class="cell" data-addr="B6"></td>
          <td class="cell" data-addr="C6"></td><td class="cell" data-addr="D6"></td>
          <td class="cell" data-addr="E6"></td><td class="cell" data-addr="F6"></td>
          <td class="cell" data-addr="G6"></td><td class="cell" data-addr="H6"></td>
        </tr>
        <tr><th class="rownum">7</th>
          <td class="cell cell-label strong" data-addr="A7">매수가 (원)</td>
          <td class="cell cell-input" data-addr="B7" data-formula="입력값">
            <input id="in-buyPrice" type="text" inputmode="numeric" value="380000">
          </td>
          <td class="cell" data-addr="C7"></td><td class="cell" data-addr="D7"></td>
          <td class="cell" data-addr="E7"></td><td class="cell" data-addr="F7"></td>
          <td class="cell" data-addr="G7"></td><td class="cell" data-addr="H7"></td>
        </tr>
        <tr><th class="rownum">8</th>
          <td class="cell cell-label strong" data-addr="A8">수량 (주)</td>
          <td class="cell cell-input" data-addr="B8" data-formula="입력값">
            <input id="in-qty" type="text" inputmode="numeric" value="10">
          </td>
          <td class="cell" data-addr="C8"></td><td class="cell" data-addr="D8"></td>
          <td class="cell" data-addr="E8"></td><td class="cell" data-addr="F8"></td>
          <td class="cell" data-addr="G8"></td><td class="cell" data-addr="H8"></td>
        </tr>
        <tr><th class="rownum">9</th>
          <td class="cell cell-label strong" data-addr="A9">현재가 (원)</td>
          <td class="cell cell-input" data-addr="B9" data-formula="입력값">
            <input id="in-curPrice" type="text" inputmode="numeric" value="415000">
          </td>
          <td class="cell" data-addr="C9"></td><td class="cell" data-addr="D9"></td>
          <td class="cell" data-addr="E9"></td><td class="cell" data-addr="F9"></td>
          <td class="cell" data-addr="G9"></td><td class="cell" data-addr="H9"></td>
        </tr>
        <tr><th class="rownum">10</th>
          <td class="cell" data-addr="A10"></td><td class="cell" data-addr="B10"></td>
          <td class="cell" data-addr="C10"></td><td class="cell" data-addr="D10"></td>
          <td class="cell" data-addr="E10"></td><td class="cell" data-addr="F10"></td>
          <td class="cell" data-addr="G10"></td><td class="cell" data-addr="H10"></td>
        </tr>
        <tr><th class="rownum">11</th>
          <td class="cell cell-label" data-addr="A11">매입금액 (원)</td>
          <td class="cell cell-calc" id="out-buyTotal" data-addr="B11" data-formula="=B7*B8">-</td>
          <td class="cell" data-addr="C11"></td><td class="cell" data-addr="D11"></td>
          <td class="cell" data-addr="E11"></td><td class="cell" data-addr="F11"></td>
          <td class="cell" data-addr="G11"></td><td class="cell" data-addr="H11"></td>
        </tr>
        <tr><th class="rownum">12</th>
          <td class="cell cell-label" data-addr="A12">평가금액 (원)</td>
          <td class="cell cell-calc" id="out-evalTotal" data-addr="B12" data-formula="=B9*B8">-</td>
          <td class="cell" data-addr="C12"></td><td class="cell" data-addr="D12"></td>
          <td class="cell" data-addr="E12"></td><td class="cell" data-addr="F12"></td>
          <td class="cell" data-addr="G12"></td><td class="cell" data-addr="H12"></td>
        </tr>
        <tr><th class="rownum">13</th>
          <td class="cell cell-label" data-addr="A13">평가손익 (원)</td>
          <td class="cell cell-calc" id="out-profitAmt" data-addr="B13" data-formula="=B12-B11">-</td>
          <td class="cell" data-addr="C13"></td><td class="cell" data-addr="D13"></td>
          <td class="cell" data-addr="E13"></td><td class="cell" data-addr="F13"></td>
          <td class="cell" data-addr="G13"></td><td class="cell" data-addr="H13"></td>
        </tr>
        <tr><th class="rownum">14</th>
          <td class="cell cell-label" data-addr="A14">수익률 (%)</td>
          <td class="cell cell-calc" id="out-profitRate" data-addr="B14" data-formula="=(B13/B11)*100">-</td>
          <td class="cell" data-addr="C14"></td><td class="cell" data-addr="D14"></td>
          <td class="cell" data-addr="E14"></td><td class="cell" data-addr="F14"></td>
          <td class="cell" data-addr="G14"></td><td class="cell" data-addr="H14"></td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="sheettabs">
    <div class="tab active">Sheet1</div>
    <div class="tab">Sheet2</div>
    <div class="plus">＋</div>
  </div>
  <div class="statusbar">
    <span>준비</span>
    <span>100%</span>
  </div>

<script>
(function(){
  const COLS = ["A","B","C","D","E","F","G","H"];
  const body = document.getElementById("sheetBody");

  // 나머지 빈 행(15~30)을 채워 실제 시트처럼 보이게 함
  for (let r = 15; r <= 30; r++) {
    const tr = document.createElement("tr");
    let html = `<th class="rownum">${r}</th>`;
    COLS.forEach(c => html += `<td class="cell" data-addr="${c}${r}"></td>`);
    tr.innerHTML = html;
    body.appendChild(tr);
  }

  // ---- 입력값 로드 ----
  const STORAGE_KEY = "samsungFireStockDashboard";
  const buyPriceEl = document.getElementById("in-buyPrice");
  const qtyEl = document.getElementById("in-qty");
  const curPriceEl = document.getElementById("in-curPrice");

  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    if (saved) {
      buyPriceEl.value = saved.buyPrice ?? buyPriceEl.value;
      qtyEl.value = saved.qty ?? qtyEl.value;
      curPriceEl.value = saved.curPrice ?? curPriceEl.value;
    }
  } catch (e) {}

  function toNumber(v){
    const n = parseFloat(String(v).replace(/[^0-9.-]/g, ""));
    return isNaN(n) ? 0 : n;
  }
  function won(n){
    return Math.round(n).toLocaleString("ko-KR") + "원";
  }
  function pct(n){
    return (n >= 0 ? "+" : "") + n.toFixed(2) + "%";
  }

  const outBuyTotal = document.getElementById("out-buyTotal");
  const outEvalTotal = document.getElementById("out-evalTotal");
  const outProfitAmt = document.getElementById("out-profitAmt");
  const outProfitRate = document.getElementById("out-profitRate");

  function recalc(){
    const buyPrice = toNumber(buyPriceEl.value);
    const qty = toNumber(qtyEl.value);
    const curPrice = toNumber(curPriceEl.value);

    const buyTotal = buyPrice * qty;
    const evalTotal = curPrice * qty;
    const profitAmt = evalTotal - buyTotal;
    const profitRate = buyTotal !== 0 ? (profitAmt / buyTotal) * 100 : 0;

    outBuyTotal.textContent = won(buyTotal);
    outEvalTotal.textContent = won(evalTotal);
    outProfitAmt.textContent = won(profitAmt);
    outProfitRate.textContent = pct(profitRate);

    [outProfitAmt, outProfitRate].forEach(el => {
      el.classList.remove("up", "down");
      el.classList.add(profitAmt >= 0 ? "up" : "down");
    });

    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        buyPrice: buyPriceEl.value, qty: qtyEl.value, curPrice: curPriceEl.value
      }));
    } catch (e) {}
  }

  [buyPriceEl, qtyEl, curPriceEl].forEach(el => el.addEventListener("input", recalc));
  recalc();

  // ---- 셀 선택 / 수식 입력줄 연동 ----
  const cellRef = document.getElementById("cellRef");
  const formulaBar = document.getElementById("formulaBar");
  let selectedCell = null;
  let boundInput = null;

  function selectCell(td){
    if (selectedCell) selectedCell.classList.remove("selected");
    selectedCell = td;
    td.classList.add("selected");
    cellRef.value = td.dataset.addr || "";

    const innerInput = td.querySelector("input");
    if (innerInput) {
      boundInput = innerInput;
      formulaBar.value = innerInput.value;
      formulaBar.readOnly = false;
    } else if (td.id && td.id.startsWith("out-")) {
      boundInput = null;
      formulaBar.value = td.dataset.formula || "";
      formulaBar.readOnly = true;
    } else {
      boundInput = null;
      formulaBar.value = td.textContent.trim();
      formulaBar.readOnly = false;
    }
  }

  document.querySelectorAll("td.cell").forEach(td => {
    td.addEventListener("mousedown", () => selectCell(td));
  });
  document.querySelectorAll(".cell-input input").forEach(inp => {
    inp.addEventListener("focus", () => selectCell(inp.closest("td.cell")));
    inp.addEventListener("input", () => { if (boundInput === inp) formulaBar.value = inp.value; });
  });
  formulaBar.addEventListener("input", () => {
    if (boundInput) {
      boundInput.value = formulaBar.value;
      boundInput.dispatchEvent(new Event("input"));
    }
  });

  // 기본 선택 셀
  selectCell(document.querySelector('[data-addr="B7"]'));

  // Enter 입력 시 엑셀처럼 아래 셀(다음 입력칸)로 이동
  const inputOrder = [buyPriceEl, qtyEl, curPriceEl];
  inputOrder.forEach((el, idx) => {
    el.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        e.preventDefault();
        const next = inputOrder[idx + 1];
        if (next) { next.focus(); next.select(); }
        else { el.blur(); }
      }
    });
  });
})();
</script>
</body>
</html>
