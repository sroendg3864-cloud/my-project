<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>인시던트 레이더</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#F5F3EC;
    --surface:#FFFFFF;
    --surface-2:#EDEAE0;
    --border:#DBD5C6;
    --ink:#1B2430;
    --ink-dim:#5B6472;
    --ink-faint:#8A93A0;
    --accent:#123C5C;
    --accent-strong:#0B2C46;
    --accent-soft:#DCE7EE;
    --warm:#B96A22;
    --danger:#B03A26;
    --danger-soft:#F3DAD3;
    --warning:#B4791A;
    --warning-soft:#F3E4C4;
    --success:#33714A;
    --success-soft:#D9EADD;
    --info:#33647F;
    --info-soft:#D8E6ED;
    --shadow: 0 1px 2px rgba(27,36,48,.06), 0 6px 20px rgba(27,36,48,.08);
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#10151B;
      --surface:#171E26;
      --surface-2:#1E2733;
      --border:#2B3542;
      --ink:#E7E4DA;
      --ink-dim:#A7AFBB;
      --ink-faint:#6C7683;
      --accent:#7FBEDD;
      --accent-strong:#9ED2EC;
      --accent-soft:#1D3646;
      --warm:#E0A25C;
      --danger:#E28A76;
      --danger-soft:#3A2320;
      --warning:#E3C077;
      --warning-soft:#3A3120;
      --success:#8FCFA3;
      --success-soft:#1E332A;
      --info:#8FC1DE;
      --info-soft:#1E2E3A;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 24px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#10151B;
    --surface:#171E26;
    --surface-2:#1E2733;
    --border:#2B3542;
    --ink:#E7E4DA;
    --ink-dim:#A7AFBB;
    --ink-faint:#6C7683;
    --accent:#7FBEDD;
    --accent-strong:#9ED2EC;
    --accent-soft:#1D3646;
    --warm:#E0A25C;
    --danger:#E28A76;
    --danger-soft:#3A2320;
    --warning:#E3C077;
    --warning-soft:#3A3120;
    --success:#8FCFA3;
    --success-soft:#1E332A;
    --info:#8FC1DE;
    --info-soft:#1E2E3A;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 24px rgba(0,0,0,.4);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans KR', 'Pretendard', system-ui, -apple-system, sans-serif;
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', monospace; font-variant-numeric: tabular-nums; }
  h1,h2,h3,h4{ margin:0; text-wrap:balance; font-weight:600; }
  a{ color:var(--accent); }
  button{ font-family:inherit; }
  ::selection{ background:var(--accent-soft); }

  #app{ min-height:100vh; display:flex; flex-direction:column; }

  /* ---------- topbar ---------- */
  .topbar{
    position:sticky; top:0; z-index:40;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    padding:12px 20px;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:10px; margin-right:auto; }
  .brand-mark{
    width:34px; height:34px; border-radius:8px;
    background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:15px; flex:none;
  }
  .brand-text h1{ font-size:17px; letter-spacing:-.01em; }
  .brand-text .sub{ font-size:12px; color:var(--ink-faint); }
  .demo-tag{
    font-size:11px; font-weight:600; letter-spacing:.03em;
    color:var(--warning); background:var(--warning-soft);
    border:1px solid color-mix(in srgb, var(--warning) 35%, transparent);
    padding:2px 7px; border-radius:99px; text-transform:uppercase;
    white-space:nowrap; display:inline-block;
  }
  .status-cluster{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .live-pill{
    display:flex; align-items:center; gap:6px;
    font-size:12.5px; color:var(--ink-dim);
    background:var(--surface-2); border:1px solid var(--border);
    padding:5px 10px; border-radius:99px;
  }
  .live-dot{ width:7px; height:7px; border-radius:50%; background:var(--success); flex:none; }
  .live-dot.paused{ background:var(--ink-faint); }
  .live-dot.pulse{ animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 color-mix(in srgb, var(--success) 55%, transparent);} 50%{ box-shadow:0 0 0 5px transparent; } }
  .btn{
    font-size:13px; font-weight:600; padding:7px 13px; border-radius:8px;
    border:1px solid var(--border); background:var(--surface); color:var(--ink);
    cursor:pointer; display:inline-flex; align-items:center; gap:6px;
    transition:background .12s, border-color .12s;
  }
  .btn:hover{ background:var(--surface-2); }
  .btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover{ background:var(--accent-strong); }
  .btn.ghost{ background:transparent; }
  .btn.small{ padding:4px 9px; font-size:12px; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .readonly-banner{
    background:var(--warning-soft); color:var(--warning);
    border-bottom:1px solid color-mix(in srgb, var(--warning) 35%, transparent);
    font-size:12.5px; padding:7px 20px; display:none; align-items:center; gap:8px;
  }
  .readonly-banner.show{ display:flex; }

  /* ---------- summary bar ---------- */
  .summary{
    display:grid; grid-template-columns:repeat(4,minmax(0,1fr));
    gap:1px; background:var(--border);
    border-bottom:1px solid var(--border);
  }
  .summary .card{
    background:var(--surface); padding:14px 20px;
    display:flex; flex-direction:column; gap:3px;
  }
  .summary .num{ font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600; font-variant-numeric: tabular-nums;}
  .summary .num.danger{ color:var(--danger); }
  .summary .num.warning{ color:var(--warning); }
  .summary .label{ font-size:12px; color:var(--ink-faint); }

  /* ---------- layout ---------- */
  .layout{
    flex:1; display:grid;
    grid-template-columns:minmax(320px,420px) 1fr;
    min-height:0;
  }
  @media (max-width:920px){
    .layout{ grid-template-columns:1fr; }
  }

  .mappane{
    border-right:1px solid var(--border);
    padding:16px; display:flex; flex-direction:column; gap:12px;
    position:sticky; top:0; align-self:flex-start;
    max-height:calc(100vh - 0px);
    overflow:auto;
  }
  @media (max-width:920px){
    .mappane{ position:static; max-height:none; border-right:none; border-bottom:1px solid var(--border); }
  }
  .map-frame{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:8px; box-shadow:var(--shadow);
  }
  .map-frame svg{ width:100%; height:auto; display:block; }
  .province{ fill:var(--surface-2); stroke:var(--border); stroke-width:1; }
  .pin{ cursor:pointer; }
  .pin circle.core{ stroke:var(--surface); stroke-width:1.6; }
  .pin circle.ring{ fill:none; stroke-width:2; opacity:.55; }
  .pin.alert .ring{ animation:ringpulse 1.8s ease-out infinite; }
  @keyframes ringpulse{
    0%{ r:7; opacity:.6; }
    100%{ r:16; opacity:0; }
  }
  .legend{ display:flex; flex-wrap:wrap; gap:8px 14px; font-size:12px; color:var(--ink-dim); padding:2px 4px; }
  .legend .item{ display:flex; align-items:center; gap:5px; }
  .legend .dot{ width:9px; height:9px; border-radius:50%; flex:none; }

  .filters{ display:flex; flex-direction:column; gap:8px; }
  .filter-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  select, input[type="text"], input[type="search"], textarea{
    font-family:inherit; font-size:13px; color:var(--ink);
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:7px 9px;
  }
  select{ padding-right:6px; }
  .search-wrap{ flex:1; min-width:140px; }
  .search-wrap input{ width:100%; }
  .toggle{
    display:inline-flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink-dim);
    cursor:pointer; user-select:none; padding:6px 10px; border:1px solid var(--border); border-radius:8px;
    background:var(--surface);
  }
  .toggle input{ accent-color:var(--accent); width:14px; height:14px; }
  .toggle.active{ background:var(--accent-soft); border-color:color-mix(in srgb, var(--accent) 40%, transparent); color:var(--accent-strong); }

  /* ---------- feed pane ---------- */
  .feedpane{ padding:16px 20px 60px; min-width:0; }
  .feed-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px; gap:10px; flex-wrap:wrap; }
  .feed-head h2{ font-size:15px; }
  .feed-count{ font-size:12.5px; color:var(--ink-faint); }
  .feed-list{ display:flex; flex-direction:column; gap:10px; }

  .card-incident{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 16px; cursor:pointer; box-shadow:var(--shadow);
    transition:border-color .12s;
  }
  .card-incident:hover{ border-color:color-mix(in srgb, var(--accent) 40%, var(--border)); }
  .card-incident.new{ animation:flashnew 2.2s ease-out; }
  @keyframes flashnew{
    0%{ background:var(--warning-soft); }
    100%{ background:var(--surface); }
  }
  .ci-top{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
  .ci-title{ font-size:14.5px; font-weight:600; }
  .ci-time{ font-size:12px; color:var(--ink-faint); white-space:nowrap; font-family:'IBM Plex Mono',monospace; }
  .ci-meta{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .badge{
    font-size:11px; font-weight:600; padding:3px 8px; border-radius:99px;
    display:inline-flex; align-items:center; gap:4px; white-space:nowrap;
  }
  .badge.type{ background:var(--surface-2); color:var(--ink-dim); }
  .badge.stage{ background:var(--info-soft); color:var(--info); }
  .badge.match{ background:var(--danger-soft); color:var(--danger); }
  .badge.nomatch{ background:var(--surface-2); color:var(--ink-faint); }
  .badge.reviewed{ background:var(--success-soft); color:var(--success); }
  .ci-stats{ display:flex; gap:16px; margin-top:9px; font-size:12.5px; color:var(--ink-dim); flex-wrap:wrap; }
  .ci-stats b{ color:var(--ink); font-family:'IBM Plex Mono',monospace; font-weight:600; }
  .ci-loc{ font-size:12px; color:var(--ink-faint); margin-top:3px; }
  .empty-state{ padding:40px 10px; text-align:center; color:var(--ink-faint); font-size:13.5px; }

  /* ---------- detail drawer ---------- */
  .scrim{
    position:fixed; inset:0; background:rgba(10,14,18,.42);
    opacity:0; pointer-events:none; transition:opacity .18s; z-index:50;
  }
  .scrim.show{ opacity:1; pointer-events:auto; }
  .detail-drawer{
    position:fixed; top:0; right:0; height:100%;
    width:min(560px, 100%);
    background:var(--surface); border-left:1px solid var(--border);
    box-shadow:-8px 0 30px rgba(0,0,0,.18);
    transform:translateX(100%); transition:transform .2s ease;
    z-index:60; display:flex; flex-direction:column;
  }
  .detail-drawer.show{ transform:translateX(0); }
  .detail-head{
    display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
    padding:16px 18px; border-bottom:1px solid var(--border);
  }
  .detail-body{ flex:1; overflow:auto; padding:16px 18px 40px; display:flex; flex-direction:column; gap:20px; }
  .section-title{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); margin-bottom:10px; }
  .kv-grid{ display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:13px; }
  .kv-grid dt{ color:var(--ink-faint); }
  .kv-grid dd{ margin:0; }

  .stepper{ display:flex; flex-direction:column; gap:0; }
  .step{ display:flex; gap:10px; }
  .step .rail{ display:flex; flex-direction:column; align-items:center; }
  .step .dot{ width:9px; height:9px; border-radius:50%; background:var(--border); margin-top:4px; flex:none; }
  .step.done .dot{ background:var(--accent); }
  .step .line{ width:1.5px; flex:1; background:var(--border); min-height:18px; }
  .step:last-child .line{ display:none; }
  .step .content{ padding-bottom:14px; }
  .step .stage-name{ font-size:13px; font-weight:600; }
  .step.done .stage-name{ color:var(--accent-strong); }
  .step .stage-time{ font-size:11.5px; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; }

  .contract-card{
    border:1px solid var(--border); border-radius:var(--radius); padding:14px;
    background:var(--surface-2); display:flex; flex-direction:column; gap:12px;
  }
  .contract-head{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
  .contract-head .pn{ font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; }
  .pill-status{ font-size:11px; font-weight:600; padding:2px 8px; border-radius:99px; white-space:nowrap; }
  .pill-status.유효{ background:var(--success-soft); color:var(--success); }
  .pill-status.만기, .pill-status.실효{ background:var(--warning-soft); color:var(--warning); }
  .coins-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  .coins-table td{ padding:4px 0; border-bottom:1px dashed var(--border); }
  .coins-table tr:last-child td{ border-bottom:none; }
  .coins-table td.pct{ text-align:right; font-family:'IBM Plex Mono',monospace; }
  .uw-box{ display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--ink-dim); }
  .uw-avatar{ width:28px; height:28px; border-radius:50%; background:var(--accent-soft); color:var(--accent-strong); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; flex:none; }

  .workflow-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .note-item{ background:var(--surface-2); border-radius:8px; padding:8px 10px; font-size:12.5px; }
  .note-item .note-meta{ color:var(--ink-faint); font-size:11px; margin-bottom:2px; }
  .add-note{ display:flex; gap:8px; }
  .add-note textarea{ flex:1; resize:vertical; min-height:38px; }
  .alert-log-item{ font-size:12px; color:var(--ink-dim); display:flex; gap:6px; }
  .alert-log-item .t{ color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; white-space:nowrap; }

  /* ---------- toast ---------- */
  .toast-root{ position:fixed; bottom:18px; right:18px; display:flex; flex-direction:column; gap:8px; z-index:80; max-width:360px; }
  .toast{
    background:var(--accent-strong); color:#fff; padding:12px 14px; border-radius:10px;
    box-shadow:var(--shadow); font-size:13px; display:flex; gap:10px; align-items:flex-start;
    animation:toastin .18s ease;
  }
  .toast.critical{ background:var(--danger); }
  @keyframes toastin{ from{ opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
  .toast a, .toast button.link{ color:#fff; text-decoration:underline; background:none; border:none; cursor:pointer; font-size:13px; padding:0; }

  .footnote{ font-size:11.5px; color:var(--ink-faint); text-align:center; padding:18px 20px 26px; }

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:99px; }
</style>
</head>
<body>
<div id="app">
  <div class="readonly-banner" id="readonlyBanner">
    <span>👁</span>
    <span>읽기 전용 화면입니다. 검토·메모·알림 발송 등 변경 사항은 저장되지 않습니다.</span>
  </div>

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">IR</div>
      <div class="brand-text">
        <h1>인시던트 레이더</h1>
        <div class="sub">전국 사고 속보 · 삼성화재 계약 연관성 확인 <span class="demo-tag">DEMO · 가상데이터</span></div>
      </div>
    </div>
    <div class="status-cluster">
      <span class="live-pill" id="livePill"><span class="live-dot pulse" id="liveDot"></span><span id="liveText">자동 갱신 중 · 10분 간격</span></span>
      <span class="live-pill" id="lastUpdatedPill">마지막 업데이트 —</span>
      <button class="btn" id="btnToggleLive">일시정지</button>
      <button class="btn primary" id="btnSimulate">＋ 새 속보 시뮬레이션</button>
    </div>
  </header>

  <div class="summary">
    <div class="card">
      <div class="num" id="statTotal">0</div>
      <div class="label">진행 중인 사고 (24시간)</div>
    </div>
    <div class="card">
      <div class="num danger" id="statMatched">0</div>
      <div class="label">삼성화재 계약 연관</div>
    </div>
    <div class="card">
      <div class="num warning" id="statUnreviewed">0</div>
      <div class="label">미검토 연관 건</div>
    </div>
    <div class="card">
      <div class="num" id="statCasualty">0</div>
      <div class="label">누적 인명피해(사망+부상)</div>
    </div>
  </div>

  <main class="layout">
    <section class="mappane">
      <div class="map-frame">
        <svg id="koreaMap" viewBox="0 0 520 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="대한민국 사고 발생 지도"></svg>
      </div>
      <div class="legend" id="mapLegend"></div>
      <div class="filters">
        <div class="filter-row">
          <select id="filterType"></select>
          <select id="filterStage"></select>
        </div>
        <div class="filter-row">
          <div class="search-wrap"><input type="search" id="filterSearch" placeholder="사고 제목·지역·업체명 검색"></div>
        </div>
        <div class="filter-row">
          <label class="toggle" id="toggleMatchedOnly"><input type="checkbox" id="chkMatchedOnly"><span>삼성화재 관련만 보기</span></label>
          <label class="toggle" id="toggleUnreviewedOnly"><input type="checkbox" id="chkUnreviewedOnly"><span>미검토만 보기</span></label>
        </div>
      </div>
    </section>

    <section class="feedpane">
      <div class="feed-head">
        <h2>속보 피드</h2>
        <span class="feed-count" id="feedCount"></span>
      </div>
      <div class="feed-list" id="feedList"></div>
    </section>
  </main>

  <div class="footnote">이 화면의 사고·뉴스·계약 정보는 전부 가상의 예시 데이터이며 실제 사고·보험 계약과 무관합니다. 실제 연동 시 뉴스 API와 사내 계약관리 시스템 API로 교체가 필요합니다.</div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="detail-drawer" id="detailDrawer" aria-hidden="true"></aside>
<div class="toast-root" id="toastRoot"></div>

<script id="state-data" type="application/json">__INITIAL_STATE_JSON__</script>

const KOREA_MAP = __KOREA_MAP_JSON__;
</script>
<script>
"use strict";
/* ============================================================
   인시던트 레이더 — app logic
   ============================================================ */

const TYPE_COLORS = {
  "화재": "#B03A26",
  "폭발": "#8E2E8A",
  "붕괴": "#B4791A",
  "수재": "#2E6FA8",
  "교통사고": "#5B6472",
  "기타": "#6C7683"
};
function typeColor(t){ return TYPE_COLORS[t] || TYPE_COLORS["기타"]; }

const STAGE_ORDER = ["신고접수","소방출동","소방·구조대출동","소방·화학구조대출동","구급대출동","호우특보","태풍특보","침수신고",
  "진압중","구조/수습","구조작업","구조/이송","배수작업","배수/응급조치","진화완료","응급복구","대응단계",
  "현장통제","교통통제","주민대피","공사중지명령","정밀안전진단","정밀진단","피해조사","원인조사","수사/조사",
  "환경영향조사","현장정리","후속조치"];

const STAGE_GROUP = {
  // maps a raw stage label to a simplified top-level workflow stage for the filter dropdown & badges
  group(stage){
    const s = stage;
    if(["신고접수","호우특보","태풍특보","침수신고"].includes(s)) return "초동";
    if(["소방출동","소방·구조대출동","소방·화학구조대출동","구급대출동","구조대출동","진압중","진압/수습","구조/수습","구조작업","구조/이송","배수작업","배수/응급조치","주민대피","현장통제","교통통제","공사중지명령"].includes(s)) return "대응/진압";
    if(["진화완료","응급복구","대응단계"].includes(s)) return "초기수습";
    if(["정밀안전진단","정밀진단","피해조사","원인조사","수사/조사","환경영향조사"].includes(s)) return "조사";
    if(["현장정리","후속조치"].includes(s)) return "후속조치";
    return "기타";
  }
};
const STAGE_GROUP_COLOR = { "초동":"warning", "대응/진압":"danger", "초기수습":"info", "조사":"info", "후속조치":"success", "기타":"" };

let RAW_TEMPLATE = null;

function fmtDateTime(iso){
  if(!iso) return "—";
  const d = new Date(iso.replace(" ","T"));
  const pad = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtRelative(iso){
  const d = new Date(iso.replace(" ","T"));
  const diffMin = Math.round((Date.now() - d.getTime())/60000);
  if(diffMin < 1) return "방금 전";
  if(diffMin < 60) return diffMin + "분 전";
  const h = Math.floor(diffMin/60);
  if(h < 24) return h + "시간 전";
  return Math.floor(h/24) + "일 전";
}
function fmtKRW(n){
  if(n === null || n === undefined) return "추산 불가";
  const eok = n / 100000000;
  if(eok >= 1) return eok.toLocaleString("ko-KR", {maximumFractionDigits:1}) + "억원";
  return (n/10000).toLocaleString("ko-KR") + "만원";
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ---------------- persistence ---------------- */

async function ensureTemplate(){
  if(RAW_TEMPLATE) return RAW_TEMPLATE;
  const res = await fetch(location.href, {cache:"no-store"});
  RAW_TEMPLATE = await res.text();
  return RAW_TEMPLATE;
}

function buildDocument(rawTemplate, state){
  const openTag = '<script id="state-data" type="application/json">';
  const closeTag = '<\/script>';
  const a = rawTemplate.indexOf(openTag);
  if(a === -1) throw new Error("state anchor not found");
  const contentStart = a + openTag.length;
  const b = rawTemplate.indexOf(closeTag, contentStart);
  if(b === -1) throw new Error("state close anchor not found");
  const json = JSON.stringify(state).replace(/</g, "\\u003C");
  return rawTemplate.slice(0, contentStart) + json + rawTemplate.slice(b);
}

async function persist(){
  updateLastUpdatedPill();
  if(!ARTIFACT || !CAN_WRITE){
    render();
    return;
  }
  try{
    const raw = await ensureTemplate();
    const html = buildDocument(raw, STATE);
    await ARTIFACT.publish(html);
    // on success the view reloads; nothing else to do
  }catch(err){
    if(err && err.code === "conflict"){
      // another view published first; it is already reloading us
      return;
    }
    if(err && (err.code === "not_writer" || err.code === "not_granted")){
      CAN_WRITE = false;
      showReadonlyBanner();
      render();
      return;
    }
    console.warn("publish failed", err);
    showToast("변경사항 저장에 실패했습니다. 이 화면에서만 임시로 반영됩니다.", false);
    render();
  }
}

/* ---------------- rendering: map ---------------- */

function project(lat, lng){
  const p = KOREA_MAP.proj;
  const x = (lng - p.minlon) * p.cosf * p.scale + p.offx;
  const y = (p.maxlat - lat) * p.scale + p.offy;
  return [x,y];
}

function renderMapBase(){
  const svg = document.getElementById("koreaMap");
  svg.setAttribute("viewBox", KOREA_MAP.viewBox);
  let paths = "";
  KOREA_MAP.provinces.forEach(p => {
    paths += `<path class="province" d="${p.d}" data-code="${p.code}"><title>${escapeHtml(p.name)}</title></path>`;
  });
  svg.innerHTML = `<g id="provinces">${paths}</g><g id="pins"></g>`;
}

function renderPins(list){
  const g = document.getElementById("pins");
  let html = "";
  list.forEach(inc => {
    const [x,y] = project(inc.location.lat, inc.location.lng);
    const color = typeColor(inc.type);
    const matched = inc.samsungMatch && inc.samsungMatch.matched;
    const alertActive = matched && !inc.workflow.reviewed;
    html += `<g class="pin${alertActive ? " alert":""}" data-id="${inc.id}" transform="translate(${x.toFixed(1)},${y.toFixed(1)})">
      ${alertActive ? `<circle class="ring" r="7" stroke="${color}"></circle>` : ""}
      <circle class="core" r="${matched?7:5.5}" fill="${color}"></circle>
    </g>`;
  });
  g.innerHTML = html;
  g.querySelectorAll(".pin").forEach(el => {
    el.addEventListener("click", () => openDetail(el.getAttribute("data-id")));
  });
}

function renderLegend(){
  const el = document.getElementById("mapLegend");
  const types = Object.keys(TYPE_COLORS);
  el.innerHTML = types.map(t => `<span class="item"><span class="dot" style="background:${typeColor(t)}"></span>${t}</span>`).join("")

}

/* ---------------- rendering: filters ---------------- */

function populateFilters(){
  const typeSel = document.getElementById("filterType");
  const types = ["all","화재","폭발","붕괴","수재","교통사고","기타"];
  typeSel.innerHTML = types.map(t => `<option value="${t}">${t==="all"?"전체 유형":t}</option>`).join("");

  const stageSel = document.getElementById("filterStage");
  const groups = ["all","초동","대응/진압","초기수습","조사","후속조치"];
  stageSel.innerHTML = groups.map(g => `<option value="${g}">${g==="all"?"전체 대응단계":g}</option>`).join("");
}

function applyFilters(list){
  return list.filter(inc => {
    if(uiFilters.type !== "all" && inc.type !== uiFilters.type) return false;
    if(uiFilters.stage !== "all" && STAGE_GROUP.group(inc.responseStage) !== uiFilters.stage) return false;
    if(uiFilters.matchedOnly && !(inc.samsungMatch && inc.samsungMatch.matched)) return false;
    if(uiFilters.unreviewedOnly && inc.workflow.reviewed) return false;
    if(uiFilters.search){
      const q = uiFilters.search.toLowerCase();
      const hay = (inc.title + " " + inc.location.region + " " + inc.location.address + " " + inc.relatedEntity.name).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

  countEl.textContent = `${list.length}건 표시 중 (전체 ${STATE.incidents.length}건)`;
  if(list.length === 0){
    wrap.innerHTML = `<div class="empty-state">조건에 맞는 사고가 없습니다.</div>`;
    return;
  }
  const sorted = [...list].sort((a,b) => new Date(b.occurredAt) - new Date(a.occurredAt));
  wrap.innerHTML = sorted.map(inc => feedCardHtml(inc)).join("");
  wrap.querySelectorAll(".card-incident").forEach(el => {
    el.addEventListener("click", () => openDetail(el.getAttribute("data-id")));
  });
}

/* ---------------- rendering: summary ---------------- */

function renderSummary(){
  const all = STATE.incidents;
  const matched = all.filter(i => i.samsungMatch && i.samsungMatch.matched);
  const unreviewed = matched.filter(i => !i.workflow.reviewed);
  const casualty = all.reduce((s,i) => s + i.casualties.dead + i.casualties.injured, 0);
  document.getElementById("statTotal").textContent = all.length;
  document.getElementById("statMatched").textContent = matched.length;
  document.getElementById("statUnreviewed").textContent = unreviewed.length;
  document.getElementById("statCasualty").textContent = casualty;
}

  const currentIdx = history.findIndex(h => h.stage === currentStage);
  return `<div class="stepper">` + history.map((h,i) => `
    <div class="step ${i<=currentIdx?"done":""}">
      <div class="rail"><div class="dot"></div><div class="line"></div></div>

        <div class="stage-name">${escapeHtml(h.stage)}</div>
        <div class="stage-time">${fmtDateTime(h.at)}</div>
      </div>
    </div>`).join("") + `</div>`;
}

function persistAndRerenderDetail(){
  persist();

}

/* ---------------- toast ---------------- */

function showToast(text, critical){
  const root = document.getElementById("toastRoot");
  const el = document.createElement("div");
  el.className = "toast" + (critical ? " critical" : "");
  el.innerHTML = `<span>${critical ? "🔺" : "ℹ️"}</span><span>${escapeHtml(text)}</span>`;
  root.appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transition="opacity .3s"; setTimeout(()=>el.remove(), 320); }, 5200);
}

/* ---------------- main render ---------------- */

function render(){
  renderSummary();
  updateLastUpdatedPill();
  const filtered = applyFilters(STATE.incidents);
  renderPins(filtered);
  renderFeed(filtered);
  if(openDetailId) renderDetail();
}

/* ---------------- new incident simulation ---------------- */

function nowIso(){
  // NOTE: uses real wall clock at the moment a viewer acts; fine for a live demo.
  return new Date().toISOString().slice(0,19);
}

const SCENARIO_POOL = [
  {title:"부산 감천항 냉동물류창고 화재", type:"화재", industry:"물류창고", region:"부산광역시", address:"부산광역시 사하구 감천항 물류단지", lat:35.0968, lng:129.0068, entity:"㈜감천콜드체인", biz:"605-81-2XXXX"},
  {title:"수원 산업단지 정밀화학 공장 폭발", type:"폭발", industry:"화학공장", region:"경기도", address:"경기도 수원시 권선구 산업단지", lat:37.2636, lng:127.0286, entity:"㈜수원케미", biz:"135-81-6XXXX"},
  {title:"춘천 신축 아파트 건설현장 붕괴", type:"붕괴", industry:"건설현장", region:"강원특별자치도", address:"강원특별자치도 춘천시 신축공사장", lat:37.8813, lng:127.7298, entity:"㈜소양건설", biz:"229-81-4XXXX"},
  {title:"김해 농산물 물류센터 화재", type:"화재", industry:"물류창고", region:"경상남도", address:"경상남도 김해시 물류단지", lat:35.2285, lng:128.8894, entity:"㈜김해프레시로지스", biz:"614-81-8XXXX"},
  {title:"천안 자동차부품 공장 화재", type:"화재", industry:"제조공장", region:"충청남도", address:"충청남도 천안시 산업단지", lat:36.8151, lng:127.1139, entity:"㈜천안오토파츠", biz:"312-81-1XXXX"},
  {title:"목포 수산물 시장 화재", type:"화재", industry:"상업시설", region:"전라남도", address:"전라남도 목포시 수산시장", lat:34.8118, lng:126.3922, entity:"목포수산시장상인회", biz:"-"},
];

let scenarioCursor = 0;
const justAddedIds = new Set();

function randInt(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[randInt(0, arr.length-1)]; }

function buildStageHistoryForNew(type, baseDate){
  const seqByType = {
    "화재": ["신고접수","소방출동","진압중","진화완료"],
    "폭발": ["신고접수","소방·화학구조대출동","진압/수습","주민대피"],
    "붕괴": ["신고접수","구조대출동","구조/수습","현장통제"],
    "수재": ["침수신고","배수작업","응급복구","피해조사"],
    "교통사고": ["신고접수","구급대출동","구조/이송","현장정리"],
  };
  const seq = seqByType[type] || ["신고접수","소방출동","진화완료"];
  const offsets = [0, randInt(3,8), randInt(20,45), randInt(60,140)];
  return seq.map((stage,i) => {
    const t = new Date(baseDate.getTime() + (offsets[i]||0)*60000);
    return { stage, at: t.toISOString().slice(0,19) };
  });
}

function maybeBuildContract(scn){
  if(Math.random() < 0.4) return { matched:false, confidence:"낮음", contracts:[] };
  const held = randInt(20,70);
  const sumInsured = randInt(20,300) * 100000000 * 10; // tens of billions range
  const seq = String(1000 + randInt(0,8999));
  const products = ["재산종합보험(패키지)","화재보험","기업종합위험보험","건설공사보험(CAR)"];
  const companies = ["DB손해보험","현대해상","KB손해보험","메리츠화재","한화손해보험","롯데손해보험"];
  const partner = pick(companies);
  return {
    matched:true, confidence: pick(["높음","중간"]),
    contracts:[{
      policyNumber: `SF-2026-AU-${seq}`,
      product: pick(products),
      policyholder: scn.entity,
      policyPeriod: { start:"2026-01-01", end:"2026-12-31" },
      status:"유효",
      samsungShare: { held:true, percentOfTotalPremium: held },
      sumInsured, lol: sumInsured,
      coverage: { perBuilding: Math.random()<0.5 ? sumInsured : null, perPerson: null, perOccurrence: sumInsured },
      coinsurance: [{company:"삼성화재", percent:held}, {company:partner, percent:100-held}],
      deductible: 100000000 * randInt(1,10),
      reinsuranceCededPercent: randInt(0,30),
      pastLossCount: randInt(0,3),
      underwriter: { name: pick(["김도윤 과장","이서연 대리","박지훈 차장","최민석 부장","정하은 과장"]), phone:"02-1234-56"+randInt(10,99), email:"underwriter@dummy-samsungfire.example" },
    }],
  };
}

function generateNewIncident(){
  const scn = SCENARIO_POOL[scenarioCursor % SCENARIO_POOL.length];
  scenarioCursor++;
  const now = new Date();
  const id = "INC-" + now.toISOString().slice(0,10).replace(/-/g,"") + "-AUTO" + STATE.nextSeq;
  STATE.nextSeq++;
  const history = buildStageHistoryForNew(scn.type, now);
  const match = maybeBuildContract(scn);
  const lossTypes = ["분손(추정중)","전손 추정","분손"];
  const inc = {
    id, occurredAt: now.toISOString().slice(0,19), title: scn.title, type: scn.type, industry: scn.industry,
    location: { address: scn.address, region: scn.region, lat: scn.lat, lng: scn.lng },
    casualties: { dead: Math.random()<0.2?randInt(1,2):0, injured: randInt(0,9), missing:0 },
    propertyDamage: { lossType: pick(lossTypes), estimatedLossKRW: randInt(3,900)*100000000, note:"현장 수습 중 — 세부 피해규모 확인 중" },
    responseStage: history[history.length-1].stage,
    stageHistory: history,
    sourceNote: "속보 시뮬레이션 (더미)",
    relatedEntity: { name: scn.entity, bizRegNo: scn.biz },
    samsungMatch: match,
    workflow: { reviewed:false, reviewedBy:null, reviewedAt:null, assignedTo:null, notes:[], alertSent:false, alertLog:[] },
  };
  STATE.incidents.unshift(inc);
  STATE.lastUpdated = inc.occurredAt;
  justAddedIds.add(id);
  return inc;
}

async function triggerNewIncident(manual){
  const inc = generateNewIncident();
  render();
  if(inc.samsungMatch.matched){
    showToast(`신규 속보: ${inc.title} — 삼성화재 계약 연관 가능성 있음`, true);
  }else if(manual){
    showToast(`신규 속보: ${inc.title}`, false);
  }
  setTimeout(() => { justAddedIds.delete(inc.id); }, 5000);
  await persist();
}

/* ---------------- live timer ---------------- */

const UPDATE_INTERVAL_MS = 10 * 60 * 1000;
let liveActive = true;

function msSinceLastUpdate(){
  return Date.now() - new Date(STATE.lastUpdated).getTime();
}

function tick(){
  if(!liveActive) return;
  if(msSinceLastUpdate() >= UPDATE_INTERVAL_MS){
    triggerNewIncident(false);
  }
}

function setLivePillState(){
  const dot = document.getElementById("liveDot");
  const text = document.getElementById("liveText");
  const btn = document.getElementById("btnToggleLive");
  if(liveActive){
    dot.classList.remove("paused"); dot.classList.add("pulse");
    text.textContent = "자동 갱신 중 · 10분 간격";
    btn.textContent = "일시정지";
  }else{
    dot.classList.add("paused"); dot.classList.remove("pulse");
    text.textContent = "자동 갱신 일시정지됨";
    btn.textContent = "재개";
  }
}

/* ---------------- init ---------------- */

function wireEvents(){
  document.getElementById("filterType").addEventListener("change", e => { uiFilters.type = e.target.value; render(); });
  document.getElementById("filterStage").addEventListener("change", e => { uiFilters.stage = e.target.value; render(); });
  document.getElementById("filterSearch").addEventListener("input", e => { uiFilters.search = e.target.value.trim(); render(); });
  document.getElementById("chkMatchedOnly").addEventListener("change", e => {
    uiFilters.matchedOnly = e.target.checked;
    document.getElementById("toggleMatchedOnly").classList.toggle("active", e.target.checked);
    render();
  });
  document.getElementById("chkUnreviewedOnly").addEventListener("change", e => {
    uiFilters.unreviewedOnly = e.target.checked;
    document.getElementById("toggleUnreviewedOnly").classList.toggle("active", e.target.checked);
    render();
  });
  document.getElementById("btnSimulate").addEventListener("click", () => triggerNewIncident(true));
  document.getElementById("btnToggleLive").addEventListener("click", () => { liveActive = !liveActive; setLivePillState(); });
  document.getElementById("scrim").addEventListener("click", closeDetail);
  document.addEventListener("keydown", e => { if(e.key === "Escape") closeDetail(); });
}

async function init(){
  loadInitialState();
  populateFilters();
  renderMapBase();
  renderLegend();
  wireEvents();
  setLivePillState();
  render();

  try{
    ARTIFACT = window.claude ? await window.claude.use("artifact") : null;
  }catch(e){ ARTIFACT = null; }
  if(!ARTIFACT) showReadonlyBanner(); // no capability available: still usable, just not persisted

  setInterval(tick, 30 * 1000);
  setInterval(() => { updateLastUpdatedPill(); renderFeed(applyFilters(STATE.incidents)); }, 60 * 1000);
}

document.addEventListener("DOMContentLoaded", init);
</script>
